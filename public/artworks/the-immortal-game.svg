<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#d4b84a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <g filter="url(#glow)">
    <path d="M400,100 L450,200 L420,200 L450,300 L350,300 L380,200 L350,200 Z" fill="none" stroke="url(#gold1)" stroke-width="3"/>
    <circle cx="400" cy="300" r="80" fill="none" stroke="url(#gold1)" stroke-width="2" opacity="0.6"/>
    <circle cx="400" cy="300" r="60" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
    <ellipse cx="400" cy="450" rx="120" ry="40" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.2"/>
    <text x="400" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#c9a227" opacity="0.7">Inmortal</text>
    <text x="400" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#8e8ea0">Anderssen vs Kieseritzky, 1851</text>
  </g>
</svg>